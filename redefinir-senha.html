<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Criar senha · Chati</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", Arial, sans-serif;
      background: #f5f5f7;
      color: #111118;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 22px;

      padding: 34px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 28px;
    }

    .logo {
      width: 40px;
      height: 40px;

      border-radius: 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #8b5cf6
        );

      color: white;
      font-size: 20px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;

      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777788;
      line-height: 1.5;

      margin-bottom: 26px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;

      font-size: 12px;
      font-weight: 700;

      margin-bottom: 7px;

      color: #555566;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid rgba(0, 0, 0, 0.13);
      border-radius: 11px;

      font-family: inherit;
      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #6c63ff;

      box-shadow:
        0 0 0 3px
        rgba(108, 99, 255, 0.12);
    }

    button {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 11px;

      background: #6c63ff;
      color: white;

      font-family: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      margin-top: 4px;

      transition:
        background 0.2s,
        opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background: #5a52e0;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;
    }

    .message.error {
      display: block;

      background: rgba(220, 38, 38, 0.08);
      color: #dc2626;
    }

    .message.success {
      display: block;

      background: rgba(22, 163, 74, 0.09);
      color: #15803d;
    }

    .message.info {
      display: block;

      background: rgba(108, 99, 255, 0.08);
      color: #5a52e0;
    }

    .password-info {
      font-size: 11px;
      color: #9999aa;

      margin-top: 6px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">
      <div class="logo">💬</div>
      <div class="brand-name">Chati</div>
    </div>

    <h1>Crie sua senha</h1>

    <p class="subtitle">
      Defina uma senha para acessar sua conta no Chati.
    </p>

    <div class="field">
      <label for="password">
        Nova senha
      </label>

      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="Digite sua nova senha"
      />

      <div class="password-info">
        Mínimo de 6 caracteres.
      </div>
    </div>

    <div class="field">
      <label for="confirm-password">
        Confirmar senha
      </label>

      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        placeholder="Digite novamente sua senha"
      />
    </div>

    <button
      id="save-button"
      type="button"
      disabled
    >
      Validando link...
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


    const supabase = createClient(
      "https://vspcitxnssbsztqnfhmj.supabase.co",
      "sb_publishable_4j4tzbnIkFYJHBdpvibKFg_weJPN_qS"
    );


    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById(
        "confirm-password"
      );

    const saveButton =
      document.getElementById("save-button");

    const message =
      document.getElementById("message");


    let sessionReady = false;


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;
    }


    function enableForm() {

      sessionReady = true;

      saveButton.disabled = false;

      saveButton.textContent =
        "Criar senha";
    }


    function invalidLink() {

      sessionReady = false;

      saveButton.disabled = true;

      saveButton.textContent =
        "Link inválido";

      showMessage(
        "Este link é inválido ou expirou. Solicite um novo convite.",
        "error"
      );
    }


    // ======================================
    // EVENTOS DE AUTENTICAÇÃO
    // ======================================

    supabase.auth.onAuthStateChange(
      (event, session) => {

        console.log(
          "Auth event:",
          event,
          session?.user?.email || null
        );

        if (session?.user) {
          enableForm();
        }

      }
    );


    // ======================================
    // VERIFICA SESSÃO
    // ======================================

    async function checkSession() {

      showMessage(
        "Validando seu convite...",
        "info"
      );

      try {

        const {
          data: { session },
          error
        } =
          await supabase.auth.getSession();


        if (error) {

          console.error(
            "Erro ao validar sessão:",
            error
          );

          invalidLink();

          return;
        }


        if (session?.user) {

          enableForm();

          message.className =
            "message";

          return;
        }


        // Aguarda um pouco porque o Supabase
        // pode estar processando a sessão da URL.

        setTimeout(
          async () => {

            const {
              data: {
                session: delayedSession
              }
            } =
              await supabase.auth.getSession();


            if (delayedSession?.user) {

              enableForm();

              message.className =
                "message";

              return;
            }


            invalidLink();

          },
          1000
        );

      } catch (error) {

        console.error(
          "Erro inesperado:",
          error
        );

        invalidLink();
      }

    }


    // ======================================
    // CRIAR SENHA
    // ======================================

    saveButton.addEventListener(
      "click",
      async () => {

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        if (!sessionReady) {

          showMessage(
            "O convite ainda não foi validado.",
            "error"
          );

          return;
        }


        if (
          !password ||
          !confirmPassword
        ) {

          showMessage(
            "Preencha os dois campos.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "A senha deve possuir pelo menos 6 caracteres.",
            "error"
          );

          return;
        }


        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "As senhas não são iguais.",
            "error"
          );

          return;
        }


        saveButton.disabled = true;

        saveButton.textContent =
          "Criando senha...";


        const {
          data,
          error
        } =
          await supabase.auth.updateUser({
            password
          });


        if (error) {

          console.error(
            "Erro ao criar senha:",
            error
          );

          showMessage(
            "Erro ao criar senha: " +
              error.message,
            "error"
          );

          saveButton.disabled = false;

          saveButton.textContent =
            "Criar senha";

          return;
        }


        console.log(
          "Senha criada:",
          data?.user?.email
        );


        showMessage(
          "Senha criada com sucesso. Redirecionando para o login...",
          "success"
        );


        saveButton.textContent =
          "Senha criada";


        await supabase.auth.signOut();


        setTimeout(
          () => {

            window.location.href =
              "/login.html";

          },
          1500
        );

      }
    );


    checkSession();

  </script>

</body>
</html>
