<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Criar senha · Chati</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", Arial, sans-serif;
      background: #f5f5f7;
      color: #111118;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 22px;

      padding: 34px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 28px;
    }

    .logo {
      width: 40px;
      height: 40px;

      border-radius: 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #8b5cf6
        );

      color: white;
      font-size: 20px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;

      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777788;
      line-height: 1.5;

      margin-bottom: 26px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;

      font-size: 12px;
      font-weight: 700;

      margin-bottom: 7px;

      color: #555566;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid rgba(0, 0, 0, 0.13);
      border-radius: 11px;

      font-family: inherit;
      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #6c63ff;

      box-shadow:
        0 0 0 3px
        rgba(108, 99, 255, 0.12);
    }

    button {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 11px;

      background: #6c63ff;
      color: white;

      font-family: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      margin-top: 4px;

      transition:
        background 0.2s,
        opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background: #5a52e0;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;
    }

    .message.error {
      display: block;

      background: rgba(220, 38, 38, 0.08);
      color: #dc2626;
    }

    .message.success {
      display: block;

      background: rgba(22, 163, 74, 0.09);
      color: #15803d;
    }

    .message.info {
      display: block;

      background: rgba(108, 99, 255, 0.08);
      color: #5a52e0;
    }

    .password-info {
      font-size: 11px;
      color: #9999aa;

      margin-top: 6px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">
      <div class="logo">💬</div>
      <div class="brand-name">Chati</div>
    </div>

    <h1>Crie sua senha</h1>

    <p class="subtitle">
      Defina uma senha para acessar sua conta no Chati.
    </p>

    <div class="field">
      <label for="password">
        Nova senha
      </label>

      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="Digite sua nova senha"
      />

      <div class="password-info">
        Mínimo de 6 caracteres.
      </div>
    </div>

    <div class="field">
      <label for="confirm-password">
        Confirmar senha
      </label>

      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        placeholder="Digite novamente sua senha"
      />
    </div>

    <button
      id="save-button"
      type="button"
      disabled
    >
      Validando link...
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <script type="module">
    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const hashParams = new URLSearchParams(
      window.location.hash.replace(/^#/, ""),
    );

    const queryParams = new URLSearchParams(
      window.location.search,
    );

    const authType =
      hashParams.get("type") ||
      queryParams.get("type");

    const callbackAccessToken =
      hashParams.get("access_token");

    const isPasswordLink =
      authType === "invite" ||
      authType === "recovery";

    function getJwtSubject(token) {
      if (!token) return null;

      try {
        const payload = token.split(".")[1];
        if (!payload) return null;

        const normalized = payload
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        const padded =
          normalized +
          "=".repeat((4 - (normalized.length % 4)) % 4);

        const json = decodeURIComponent(
          Array.from(atob(padded))
            .map(
              (char) =>
                "%" +
                char
                  .charCodeAt(0)
                  .toString(16)
                  .padStart(2, "0"),
            )
            .join(""),
        );

        return JSON.parse(json)?.sub || null;
      } catch (error) {
        console.warn(
          "Não foi possível identificar o usuário do link:",
          error,
        );
        return null;
      }
    }

    const expectedAuthUserId =
      getJwtSubject(callbackAccessToken);

    if (isPasswordLink) {
      localStorage.removeItem("chati_session");
      localStorage.removeItem("chati_user");
      sessionStorage.removeItem("chati_session");
      sessionStorage.removeItem("chati_user");
    }

    const supabase = createClient(
      "https://vspcitxnssbsztqnfhmj.supabase.co",
      "sb_publishable_4j4tzbnIkFYJHBdpvibKFg_weJPN_qS",
    );

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById(
        "confirm-password",
      );

    const saveButton =
      document.getElementById("save-button");

    const message =
      document.getElementById("message");

    let sessionReady = false;
    let validatedUserId = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className =
        "message " + type;
    }

    function hideMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function enableForm(session) {
      sessionReady = true;
      validatedUserId =
        session?.user?.id || null;

      saveButton.disabled = false;
      saveButton.textContent =
        authType === "invite"
          ? "Criar senha"
          : "Salvar nova senha";

      hideMessage();
    }

    function invalidLink(text) {
      sessionReady = false;
      validatedUserId = null;

      saveButton.disabled = true;
      saveButton.textContent =
        "Link inválido";

      showMessage(
        text ||
          "Este link é inválido ou expirou. Solicite um novo convite ou uma nova recuperação de senha.",
        "error",
      );
    }

    function sessionMatchesLink(session) {
      if (!session?.user) {
        return false;
      }

      if (!isPasswordLink) {
        return false;
      }

      if (
        expectedAuthUserId &&
        session.user.id !== expectedAuthUserId
      ) {
        return false;
      }

      return true;
    }

    supabase.auth.onAuthStateChange(
      (event, session) => {
        console.log(
          "Auth event:",
          event,
          session?.user?.email || null,
          "type:",
          authType,
        );

        if (
          event === "PASSWORD_RECOVERY" &&
          authType === "recovery" &&
          sessionMatchesLink(session)
        ) {
          enableForm(session);
          return;
        }

        if (
          authType === "invite" &&
          sessionMatchesLink(session)
        ) {
          enableForm(session);
        }
      },
    );

    async function checkSession() {
      showMessage(
        "Validando seu link...",
        "info",
      );

      if (!isPasswordLink) {
        invalidLink(
          "Abra esta página pelo link enviado ao seu e-mail. Uma sessão já aberta no navegador não é suficiente para alterar a senha.",
        );
        return;
      }

      try {
        await new Promise((resolve) =>
          setTimeout(resolve, 350),
        );

        const {
          data: { session },
          error,
        } = await supabase.auth.getSession();

        if (error) {
          console.error(
            "Erro ao validar sessão:",
            error,
          );

          invalidLink();
          return;
        }

        if (!sessionMatchesLink(session)) {
          console.warn(
            "A sessão atual não corresponde ao usuário do link.",
            {
              authType,
              expectedAuthUserId,
              sessionUserId:
                session?.user?.id || null,
            },
          );

          invalidLink(
            "Este link não corresponde à sessão autenticada. Abra novamente o link recebido no e-mail.",
          );
          return;
        }

        const {
          data: userData,
          error: userError,
        } = await supabase.auth.getUser(
          session.access_token,
        );

        if (
          userError ||
          !userData?.user ||
          userData.user.id !== session.user.id
        ) {
          console.error(
            "Não foi possível confirmar o usuário do link:",
            userError,
          );

          invalidLink();
          return;
        }

        enableForm(session);
      } catch (error) {
        console.error(
          "Erro inesperado:",
          error,
        );

        invalidLink();
      }
    }

    saveButton.addEventListener(
      "click",
      async () => {
        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;

        if (
          !sessionReady ||
          !validatedUserId ||
          !isPasswordLink
        ) {
          showMessage(
            "O link não foi validado para alteração de senha.",
            "error",
          );
          return;
        }

        if (
          !password ||
          !confirmPassword
        ) {
          showMessage(
            "Preencha os dois campos.",
            "error",
          );
          return;
        }

        if (password.length < 6) {
          showMessage(
            "A senha deve possuir pelo menos 6 caracteres.",
            "error",
          );
          return;
        }

        if (
          password !==
          confirmPassword
        ) {
          showMessage(
            "As senhas não são iguais.",
            "error",
          );
          return;
        }

        saveButton.disabled = true;
        saveButton.textContent =
          authType === "invite"
            ? "Criando senha..."
            : "Salvando senha...";

        try {
          const {
            data: { session },
            error: sessionError,
          } = await supabase.auth.getSession();

          if (
            sessionError ||
            !sessionMatchesLink(session) ||
            session.user.id !== validatedUserId
          ) {
            throw new Error(
              "A sessão do link não é mais válida.",
            );
          }

          const {
            data: userData,
            error: userError,
          } = await supabase.auth.getUser(
            session.access_token,
          );

          if (
            userError ||
            !userData?.user ||
            userData.user.id !== validatedUserId
          ) {
            throw new Error(
              "Não foi possível confirmar o usuário deste link.",
            );
          }

          const {
            data,
            error,
          } = await supabase.auth.updateUser({
            password,
          });

          if (error) {
            throw error;
          }

          console.log(
            "Senha definida para:",
            data?.user?.email,
          );

          showMessage(
            authType === "invite"
              ? "Senha criada com sucesso. Redirecionando para o login..."
              : "Senha alterada com sucesso. Redirecionando para o login...",
            "success",
          );

          saveButton.textContent =
            "Senha salva";

          sessionReady = false;

          await supabase.auth.signOut();

          localStorage.removeItem(
            "chati_session",
          );
          localStorage.removeItem(
            "chati_user",
          );
          sessionStorage.removeItem(
            "chati_session",
          );
          sessionStorage.removeItem(
            "chati_user",
          );

          history.replaceState(
            null,
            "",
            "/redefinir-senha.html",
          );

          setTimeout(() => {
            window.location.href =
              "/login.html";
          }, 1500);
        } catch (error) {
          console.error(
            "Erro ao alterar senha:",
            error,
          );

          showMessage(
            "Erro ao alterar senha: " +
              (error?.message ||
                "tente novamente."),
            "error",
          );

          saveButton.disabled = false;

          saveButton.textContent =
            authType === "invite"
              ? "Criar senha"
              : "Salvar nova senha";
        }
      },
    );

    checkSession();
  </script>

</body>
</html>
