<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://vspcitxnssbsztqnfhmj.supabase.co",
    "sb_publishable_4j4tzbnIkFYJHBdpvibKFg_weJPN_qS"
  );

  const passwordInput =
    document.getElementById("password");

  const confirmPasswordInput =
    document.getElementById("confirm-password");

  const saveButton =
    document.getElementById("save-button");

  const message =
    document.getElementById("message");

  let sessionReady = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  function enablePasswordForm() {
    sessionReady = true;

    saveButton.disabled = false;
    saveButton.textContent = "Criar senha";
  }

  function disablePasswordForm() {
    sessionReady = false;

    saveButton.disabled = true;
    saveButton.textContent = "Validando link...";
  }

  disablePasswordForm();

  // ==========================================
  // ESCUTA EVENTOS DO SUPABASE AUTH
  // ==========================================

  supabase.auth.onAuthStateChange(
    (event, session) => {
      console.log(
        "Auth event:",
        event,
        session?.user?.email || null,
      );

      if (session?.user) {
        enablePasswordForm();
      }
    },
  );

  // ==========================================
  // VERIFICA A SESSÃO DO LINK
  // ==========================================

  async function checkSession() {
    try {
      const {
        data: { session },
        error,
      } = await supabase.auth.getSession();

      if (error) {
        console.error(
          "Erro ao validar sessão:",
          error,
        );

        showMessage(
          "Não foi possível validar este link.",
          "error",
        );

        saveButton.textContent =
          "Link inválido";

        return;
      }

      if (session?.user) {
        enablePasswordForm();

        return;
      }

      // O Supabase pode ainda estar processando
      // o token presente na URL.
      setTimeout(async () => {
        const {
          data: { session: delayedSession },
        } = await supabase.auth.getSession();

        if (delayedSession?.user) {
          enablePasswordForm();

          return;
        }

        showMessage(
          "Este link é inválido ou expirou. Solicite um novo convite ou uma nova recuperação de senha.",
          "error",
        );

        saveButton.disabled = true;
        saveButton.textContent =
          "Link inválido";
      }, 800);
    } catch (error) {
      console.error(
        "Erro inesperado:",
        error,
      );

      showMessage(
        "Não foi possível validar este link.",
        "error",
      );

      saveButton.disabled = true;
      saveButton.textContent =
        "Link inválido";
    }
  }

  // ==========================================
  // SALVAR NOVA SENHA
  // ==========================================

  saveButton.addEventListener(
    "click",
    async () => {
      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;

      if (!sessionReady) {
        showMessage(
          "O link ainda não foi validado.",
          "error",
        );

        return;
      }

      if (!password || !confirmPassword) {
        showMessage(
          "Preencha os dois campos.",
          "error",
        );

        return;
      }

      if (password.length < 6) {
        showMessage(
          "A senha deve possuir pelo menos 6 caracteres.",
          "error",
        );

        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "As senhas não são iguais.",
          "error",
        );

        return;
      }

      saveButton.disabled = true;
      saveButton.textContent =
        "Criando senha...";

      const {
        data,
        error,
      } = await supabase.auth.updateUser({
        password,
      });

      if (error) {
        console.error(
          "Erro ao alterar senha:",
          error,
        );

        showMessage(
          "Erro ao criar senha: " +
            error.message,
          "error",
        );

        saveButton.disabled = false;
        saveButton.textContent =
          "Criar senha";

        return;
      }

      console.log(
        "Senha definida para:",
        data?.user?.email,
      );

      showMessage(
        "Senha criada com sucesso. Redirecionando para o login...",
        "success",
      );

      saveButton.textContent =
        "Senha criada";

      // O usuário veio autenticado pelo convite.
      // Saímos dessa sessão para que ele faça o
      // primeiro login normalmente.
      await supabase.auth.signOut();

      setTimeout(() => {
        window.location.href =
          "/login.html";
      }, 1500);
    },
  );

  checkSession();
</script>
