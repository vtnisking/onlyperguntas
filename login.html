<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Entrar - Chati</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #08090b;
        color: #fff;
      }
      [hidden] { display: none !important; }

      .tela-login { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; isolation: isolate; }
      .tela-login.saindo { animation: login-sair .3s ease forwards; }
      @keyframes login-sair { to { opacity: 0; transform: scale(.985); } }

      /* ---------- Fundo animado ---------- */
      .login-fundo { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
      .login-camada { position: absolute; inset: 0; will-change: transform; }
      .login-orbe { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
      .login-orbe-1 { width: 55vmax; height: 55vmax; left: -12vmax; bottom: -22vmax;
        background: radial-gradient(circle, #e8002d 0%, rgba(232, 0, 45, 0) 65%);
        animation: login-orbe-1 18s ease-in-out infinite alternate; }
      .login-orbe-2 { width: 45vmax; height: 45vmax; right: -14vmax; top: -18vmax;
        background: radial-gradient(circle, #a8001f 0%, rgba(168, 0, 31, 0) 65%);
        opacity: .4; animation: login-orbe-2 22s ease-in-out infinite alternate; }
      @keyframes login-orbe-1 { to { transform: translate(12vmax, -8vmax) scale(1.1); } }
      @keyframes login-orbe-2 { to { transform: translate(-10vmax, 10vmax) scale(.9); } }
      .login-luz { position: absolute; left: 0; top: 0; width: 38vmax; height: 38vmax; margin: -19vmax 0 0 -19vmax; border-radius: 50%;
        background: radial-gradient(circle, rgba(232, 0, 45, .16) 0%, rgba(232, 0, 45, 0) 62%); filter: blur(40px);
        opacity: 0; transition: opacity .8s ease; will-change: transform; }
      .login-luz.ativa { opacity: 1; }
      .login-grade { position: absolute; inset: 0; opacity: .06;
        background-image: linear-gradient(rgba(255, 255, 255, .7) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .7) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
        mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
      .login-linhas span { position: absolute; left: -30%; height: 1.5px; width: 22%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, rgba(255, 51, 85, .95), transparent); opacity: 0; animation: login-linha 7s linear infinite; }
      .login-linhas span:nth-child(1) { top: 14%; }
      .login-linhas span:nth-child(2) { top: 31%; width: 15%; animation-delay: 1.6s; animation-duration: 5.5s; }
      .login-linhas span:nth-child(3) { top: 49%; animation-delay: 3.1s; animation-duration: 8s; }
      .login-linhas span:nth-child(4) { top: 66%; width: 18%; animation-delay: .8s; animation-duration: 6.5s; }
      .login-linhas span:nth-child(5) { top: 81%; animation-delay: 4.4s; }
      .login-linhas span:nth-child(6) { top: 92%; width: 12%; animation-delay: 2.4s; animation-duration: 6s; }
      @keyframes login-linha { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: .9; } 80% { opacity: .5; } 100% { transform: translateX(650%); opacity: 0; } }

      /* ---------- Cartão central ---------- */
      .login-centro { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6rem; padding: 2rem 1.2rem; }
      .login-cartao { position: relative; width: min(420px, 100%); background: #fff; color: #0b0c0f; border-radius: 20px; padding: 2.4rem 2.2rem 2rem;
        display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
        animation: login-entra .7s cubic-bezier(.2, .8, .2, 1) both; }
      .login-cartao::before { content: ""; position: absolute; left: 24px; right: 24px; top: 0; height: 3px; border-radius: 0 0 3px 3px;
        background: linear-gradient(90deg, transparent, #e8002d, #ff3355, #e8002d, transparent); background-size: 200% 100%; animation: login-faixa 4s linear infinite; }
      @keyframes login-faixa { from { background-position: 200% 0; } to { background-position: 0 0; } }
      @keyframes login-entra { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }
      .login-cartao > * { animation: login-item .6s ease both; }
      .login-cartao > :nth-child(2) { animation-delay: .08s; }
      .login-cartao > :nth-child(3) { animation-delay: .14s; }
      .login-cartao > :nth-child(4) { animation-delay: .2s; }
      .login-cartao > :nth-child(5), .login-cartao > :nth-child(6) { animation-delay: .26s; }
      .login-cartao > :nth-child(n+7) { animation-delay: .32s; }
      @keyframes login-item { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      .login-marca { display: flex; justify-content: center; margin: .2rem 0 .8rem; }
      .login-marca img { width: 170px; height: auto; display: block; }
      .login-cabecalho { margin-bottom: .4rem; text-align: center; }
      .login-cabecalho h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.025em; margin: 0 0 .35rem; }
      .login-cabecalho p { color: #6b7180; margin: 0 auto; max-width: 36ch; line-height: 1.5; font-size: .95rem; }
      .destaque-marca { color: #e8002d; font-weight: 700; }
      .login-rodape { color: #8b909b; font-size: .9rem; letter-spacing: .01em; animation: login-item .8s .5s ease both; }
      .login-rodape em { font-style: normal; color: #ff3355; font-weight: 600; }

      /* ---------- Campos com rótulo flutuante ---------- */
      .lc-campo { position: relative; }
      .lc-campo input { width: 100%; height: 56px; padding: 1.35rem 1rem .45rem; font: inherit; font-size: 1rem; color: #0b0c0f;
        border: 1.5px solid #e3e5ea; border-radius: 12px; background: #f7f7f9; transition: border-color .2s, background .2s, box-shadow .2s; }
      .lc-com-botao input { padding-right: 3.2rem; }
      .lc-campo input:hover { border-color: #c9ccd4; }
      .lc-campo input:focus { outline: none; border-color: #0b0c0f; background: #fff; box-shadow: 0 0 0 4px rgba(232, 0, 45, .12); }
      .lc-campo input:-webkit-autofill, .lc-campo input:-webkit-autofill:hover { -webkit-box-shadow: 0 0 0 100px #f7f7f9 inset; -webkit-text-fill-color: #0b0c0f; caret-color: #0b0c0f; }
      .lc-campo input:-webkit-autofill:focus { -webkit-box-shadow: 0 0 0 100px #fff inset, 0 0 0 4px rgba(232, 0, 45, .12); }
      .lc-campo label { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #8a8f9c; font-size: 1rem; pointer-events: none;
        transition: top .18s ease, font-size .18s ease, color .18s ease; }
      .lc-campo input:focus + label, .lc-campo input:not(:placeholder-shown) + label, .lc-campo input:-webkit-autofill + label {
        top: 1.05rem; font-size: .72rem; font-weight: 700; color: #0b0c0f; letter-spacing: .02em; }
      .lc-campo input:focus + label { color: #e8002d; }
      .lc-olho { position: absolute; right: .55rem; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center;
        border: 0; background: none; color: #8a8f9c; border-radius: 10px; cursor: pointer; transition: color .2s, background .2s; }
      .lc-olho:hover { color: #0b0c0f; background: #eceef2; }
      .lc-olho svg { width: 20px; height: 20px; }

      .lc-opcoes { display: flex; justify-content: space-between; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; margin: -.2rem 0 .2rem; }
      .lc-check { display: inline-flex; align-items: center; gap: .45rem; font-size: .86rem; color: #4b5060; cursor: pointer; user-select: none; }
      .lc-check input { width: 17px; height: 17px; margin: 0; accent-color: #e8002d; cursor: pointer; }
      .lc-link { border: 0; background: none; padding: 0; font: inherit; font-size: .86rem; font-weight: 600; color: #e8002d; cursor: pointer; }
      .lc-link:hover { text-decoration: underline; text-underline-offset: 2px; }

      /* Mensagens (erro e sucesso) */
      .feedback { text-align: center; max-height: 0; overflow: hidden; font-size: .88rem; font-weight: 600; line-height: 1.4;
        opacity: 0; margin: -.3rem 0 0; transition: max-height .25s ease, opacity .25s ease, margin .25s ease; }
      .feedback.error, .feedback.success { max-height: 5rem; opacity: 1; margin: 0; }
      .feedback.error { color: #c20026; }
      .feedback.success { color: #1b7f46; }
      .lc-sacode { animation: lc-sacode .4s ease !important; }
      @keyframes lc-sacode { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

      .btn-login { position: relative; height: 54px; margin-top: .2rem; border: 0; border-radius: 12px; background: #e8002d; color: #fff; font: inherit; font-weight: 700; font-size: 1rem;
        cursor: pointer; overflow: hidden; transition: background .2s, transform .15s, box-shadow .2s; box-shadow: 0 10px 24px -10px rgba(232, 0, 45, .75); }
      .btn-login::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%);
        transform: translateX(-100%); transition: transform .6s ease; }
      .btn-login:hover:not(:disabled) { background: #c20026; box-shadow: 0 14px 28px -10px rgba(232, 0, 45, .85); transform: translateY(-1px); }
      .btn-login:hover:not(:disabled)::after { transform: translateX(100%); }
      .btn-login:active:not(:disabled) { transform: translateY(1px) scale(.995); }
      .btn-login:disabled { cursor: wait; }
      .spinner { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2.5px solid rgba(255, 255, 255, .35);
        border-top-color: #fff; border-radius: 50%; opacity: 0; animation: lc-gira .7s linear infinite; }
      .btn-login.loading .btn-text { opacity: 0; }
      .btn-login.loading .spinner { opacity: 1; }
      @keyframes lc-gira { to { transform: rotate(360deg); } }
      .lc-ajuda { display: flex; align-items: center; justify-content: center; gap: .4rem; color: #8a8f9c; font-size: .82rem; margin-top: .3rem; text-align: center; }
      .lc-ajuda svg { width: 14px; height: 14px; flex: none; }

      @media (max-width: 520px) {
        .login-cartao { padding: 2rem 1.4rem 1.6rem; border-radius: 18px; }
        .login-cabecalho h1 { font-size: 1.5rem; }
        .lc-opcoes { flex-wrap: nowrap; }
        .lc-check, .lc-link { font-size: .82rem; white-space: nowrap; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; animation: none !important; }
        .login-luz { display: none; }
      }
    </style>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chati" />
    <script src="/pwa.js" defer></script>
  </head>

  <body>
    <div class="tela-login">
      <div class="login-fundo" aria-hidden="true">
        <div class="login-camada" data-prof="-70"><div class="login-orbe login-orbe-1"></div></div>
        <div class="login-camada" data-prof="55"><div class="login-orbe login-orbe-2"></div></div>
        <div class="login-luz"></div>
        <div class="login-grade"></div>
        <div class="login-linhas"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>

      <main class="login-centro">
        <form class="login-cartao" id="loginForm" novalidate>
          <div class="login-marca">
            <img src="/assets/logo-chati-black.png" alt="Chati" width="170" height="59" />
          </div>

          <header class="login-cabecalho">
            <h1>Bem-vindo de volta</h1>
            <p>Atender com <strong class="destaque-marca">inteligência</strong> nunca foi tão fácil.</p>
          </header>

          <div class="lc-campo">
            <input id="email" name="email" type="email" placeholder=" " autocomplete="username" inputmode="email" required autofocus />
            <label for="email">E-mail</label>
          </div>

          <div class="lc-campo lc-com-botao">
            <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required />
            <label for="password">Senha</label>
            <button class="lc-olho password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.06 12.35a1 1 0 0 1 0-.7C3.72 7.6 7.65 5 12 5c4.35 0 8.28 2.6 9.94 6.65a1 1 0 0 1 0 .7C20.28 16.4 16.35 19 12 19c-4.35 0-8.28-2.6-9.94-6.65Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>

          <div class="lc-opcoes">
            <label class="lc-check"><input type="checkbox" id="lembrarEmail" /><span>Lembrar meu e-mail</span></label>
            <button class="lc-link forgot-link" type="button" onclick="forgotPassword()">Esqueci minha senha</button>
          </div>

          <div class="feedback" id="error" role="alert" aria-live="polite"></div>

          <button class="btn-login" type="submit">
            <span class="btn-text">Entrar</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>

          <p class="lc-ajuda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            Ambiente seguro e criptografado
          </p>
        </form>

        <p class="login-rodape">Todos os canais, <em>um só lugar.</em></p>
      </main>
    </div>

    <script>
      // Luz que acompanha o mouse e leve paralaxe das manchas (igual ao Chati ERP)
      (function () {
        const fundo = document.querySelector(".login-fundo");
        if (!fundo || matchMedia("(prefers-reduced-motion: reduce)").matches || matchMedia("(pointer: coarse)").matches) return;
        const camadas = [...fundo.querySelectorAll("[data-prof]")].map((el) => ({ el, prof: Number(el.dataset.prof) }));
        const luz = fundo.querySelector(".login-luz");
        const alvo = { x: 0.5, y: 0.5 };
        const atual = { x: 0.5, y: 0.5 };
        let quadro = null;
        function passo() {
          atual.x += (alvo.x - atual.x) * 0.05;
          atual.y += (alvo.y - atual.y) * 0.05;
          const dx = atual.x - 0.5, dy = atual.y - 0.5;
          for (const c of camadas) c.el.style.transform = `translate3d(${(dx * c.prof).toFixed(1)}px, ${(dy * c.prof).toFixed(1)}px, 0)`;
          luz.style.transform = `translate3d(${(atual.x * innerWidth).toFixed(1)}px, ${(atual.y * innerHeight).toFixed(1)}px, 0)`;
          quadro = Math.abs(alvo.x - atual.x) + Math.abs(alvo.y - atual.y) > 0.0004 ? requestAnimationFrame(passo) : null;
        }
        addEventListener("pointermove", (e) => {
          alvo.x = e.clientX / innerWidth;
          alvo.y = e.clientY / innerHeight;
          luz.classList.add("ativa");
          if (!quadro) quadro = requestAnimationFrame(passo);
        }, { passive: true });
      })();

      // Lembrar e-mail (só neste navegador)
      (function () {
        const email = document.getElementById("email");
        const caixa = document.getElementById("lembrarEmail");
        let salvo = "";
        try { salvo = localStorage.getItem("chati_lembrar_email") || ""; } catch (e) {}
        if (salvo) {
          email.value = salvo;
          caixa.checked = true;
          email.removeAttribute("autofocus");
          setTimeout(() => document.getElementById("password").focus(), 0);
        }
        document.getElementById("loginForm").addEventListener("submit", () => {
          try {
            if (caixa.checked && email.value.trim()) localStorage.setItem("chati_lembrar_email", email.value.trim());
            else localStorage.removeItem("chati_lembrar_email");
          } catch (e) {}
        }, true);
      })();
    </script>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

      // Remove cópias antigas da sessão guardadas pela biblioteca do Supabase.
      Object.keys(localStorage)
        .filter((k) => k.startsWith("sb-") && k.endsWith("-auth-token"))
        .forEach((k) => localStorage.removeItem(k));

      // Sem guardar/renovar sessão aqui: quem renova é o Chati (/api/refresh-token).
      const supabase = createClient(
        "https://vspcitxnssbsztqnfhmj.supabase.co",
        "sb_publishable_4j4tzbnIkFYJHBdpvibKFg_weJPN_qS",
        {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false,
          },
        },
      );

async function redirectIfAuthenticated() {
  const sessionRaw =
    localStorage.getItem("chati_session") ||
    sessionStorage.getItem("chati_session");

  if (!sessionRaw) {
    return;
  }

  try {
    const savedSession = JSON.parse(sessionRaw);
    const accessToken = savedSession?.access_token;

    if (!accessToken) {
      throw new Error("Sessão sem access token");
    }

    const {
      data: userData,
      error: userError,
    } = await supabase.auth.getUser(accessToken);

    if (userError || !userData?.user) {
      throw new Error("Sessão expirada");
    }

    const userRaw =
      localStorage.getItem("chati_user") ||
      sessionStorage.getItem("chati_user");

    const loggedUser = userRaw
      ? JSON.parse(userRaw)
      : null;

    if (loggedUser?.role === "superadmin") {
      window.location.replace("/superadmin.html");
      return;
    }

    window.location.replace("/app");
  } catch (error) {
    console.warn(
      "Sessão local inválida. Limpando dados:",
      error,
    );

    localStorage.removeItem("chati_session");
    localStorage.removeItem("chati_user");
    sessionStorage.removeItem("chati_session");
    sessionStorage.removeItem("chati_user");

    await supabase.auth.signOut({ scope: "local" }).catch(() => {});
  }
}

redirectIfAuthenticated();

      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const passwordToggle = document.getElementById("passwordToggle");
      const errorBox = document.getElementById("error");
      const btn = document.querySelector(".btn-login");
      const btnText = document.querySelector(".btn-text");

      function showFeedback(message, type = "error") {
        errorBox.className = `feedback ${type}`;
        errorBox.textContent = message;
        if (type === "error") {
          const card = document.getElementById("loginForm");
          card.classList.remove("lc-sacode");
          void card.offsetWidth;
          card.classList.add("lc-sacode");
        }
      }

      function clearFeedback() {
        errorBox.className = "feedback";
        errorBox.textContent = "";
      }

      if (new URLSearchParams(location.search).get("sessao") === "expirada") {
        showFeedback("Sua sessão expirou. Entre novamente para continuar.");
      }

      function setLoading(isLoading) {
        btn.disabled = isLoading;
        btn.classList.toggle("loading", isLoading);
        btnText.textContent = "Entrar";
        btn.setAttribute("aria-busy", String(isLoading));
      }

      async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        clearFeedback();

        if (!email || !password) {
          showFeedback("Preencha o e-mail e a senha para continuar.");
          (!email ? emailInput : passwordInput).focus();
          return;
        }

        setLoading(true);

        try {
          const { data: authData, error: authError } =
            await supabase.auth.signInWithPassword({ email, password });

          if (authError || !authData.user) {
            console.error("Erro do Supabase Auth:", authError);
            const msg = String(authError?.message || "");
            throw new Error(
              /invalid login|invalid credentials/i.test(msg) ? "E-mail ou senha incorretos." :
              /email not confirmed/i.test(msg) ? "Confirme seu e-mail antes de entrar." :
              /rate limit|too many/i.test(msg) ? "Muitas tentativas. Aguarde um pouco e tente de novo." :
              msg || "E-mail ou senha incorretos.",
            );
          }

          const { data: userData, error: userError } = await supabase
            .from("users_app")
            .select("id, name, email, role, status, company_id")
            .eq("email", authData.user.email)
            .single();

          if (userError || !userData) {
            await supabase.auth.signOut({ scope: "local" });
            throw new Error("Usuário não cadastrado no sistema.");
          }

          if (userData.status !== "active") {
            await supabase.auth.signOut({ scope: "local" });
            throw new Error("Este usuário está desativado.");
          }

          if (!authData.session?.access_token) {
            throw new Error("O Supabase não retornou uma sessão válida.");
          }

          localStorage.setItem(
            "chati_user",
            JSON.stringify({
              id: userData.id,
              auth_id: authData.user.id,
              name: userData.name,
              email: userData.email,
              role: userData.role,
              company_id: userData.company_id,
            }),
          );

          localStorage.setItem(
            "chati_session",
            JSON.stringify({
              access_token: authData.session.access_token,
              refresh_token: authData.session.refresh_token,
              expires_at: authData.session.expires_at,
              expires_in: authData.session.expires_in,
              token_type: authData.session.token_type,
            }),
          );

          if (userData.role === "superadmin") {
  window.location.replace("/superadmin.html");
} else {
  window.location.replace("/app");
}
        } catch (error) {
          showFeedback(error.message || "Não foi possível entrar. Tente novamente.");
          setLoading(false);
        }
      }

      async function forgotPassword() {
        const email = emailInput.value.trim();
        clearFeedback();

        if (!email) {
          showFeedback("Digite seu e-mail para receber o link de redefinição.");
          emailInput.focus();
          return;
        }

        showFeedback("Enviando o link de redefinição...", "success");

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/redefinir-senha.html",
        });

        if (error) {
          showFeedback("Erro ao enviar o e-mail. Tente novamente.");
          return;
        }

        showFeedback("E-mail enviado! Verifique sua caixa de entrada.", "success");
      }

      passwordToggle.addEventListener("click", () => {
        const shouldShow = passwordInput.type === "password";
        passwordInput.type = shouldShow ? "text" : "password";
        passwordToggle.setAttribute("aria-label", shouldShow ? "Ocultar senha" : "Mostrar senha");
        passwordToggle.setAttribute("aria-pressed", String(shouldShow));
      });

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        login();
      });

      window.login = login;
      window.forgotPassword = forgotPassword;
    </script>
  </body>
</html>
